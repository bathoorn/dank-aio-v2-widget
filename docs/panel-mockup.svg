  <circle cx="250" cy="286" r="7" fill="#141218"/>
  <g color="#938f99"><use href="#i-bt" x="284" y="276" width="20" height="20"/></g>
  <text x="314" y="283" font-size="13" fill="#e6e0e9">BT hci1</text>
