<svg viewBox="0 0 340 590" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <symbol id="i-antenna" viewBox="0 0 20 20">
      <circle cx="10" cy="5" r="2" fill="currentColor"/>
      <line x1="10" y1="7" x2="10" y2="16" stroke="currentColor" stroke-width="1.5"/>
      <line x1="10" y1="16" x2="5" y2="16" stroke="currentColor" stroke-width="1.5"/>
      <line x1="10" y1="16" x2="15" y2="16" stroke="currentColor" stroke-width="1.5"/>
    </symbol>
    <symbol id="i-gps" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="10" cy="10" r="2.5" fill="currentColor"/>
    </symbol>
    <symbol id="i-lora" viewBox="0 0 20 20">
      <circle cx="5" cy="15" r="1.5" fill="currentColor"/>
      <path d="M8 12 A4.2 4.2 0 0 1 8 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M11 9 A8.2 8.2 0 0 1 11 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-sdr" viewBox="0 0 20 20">
      <line x1="10" y1="10" x2="10" y2="17" stroke="currentColor" stroke-width="1.5"/>
      <line x1="6" y1="17" x2="14" y2="17" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="10" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <line x1="10" y1="8" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/>
    </symbol>
    <symbol id="i-usb" viewBox="0 0 20 20">
      <line x1="10" y1="4" x2="10" y2="12" stroke="currentColor" stroke-width="1.5"/>
      <line x1="10" y1="6" x2="14" y2="6" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="14" cy="6" r="1.4" fill="currentColor"/>
      <line x1="10" y1="9" x2="6" y2="9" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="6" cy="9" r="1.4" fill="currentColor"/>
      <rect x="8" y="12" width="4" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </symbol>
    <symbol id="i-wifi" viewBox="0 0 20 20">
      <circle cx="10" cy="15" r="1.5" fill="currentColor"/>
      <path d="M6.5 12 A5 5 0 0 1 13.5 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M3.5 9 A9.5 9.5 0 0 1 16.5 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-bt" viewBox="0 0 20 20">
      <path d="M7 5 L13 11 L7 15 M13 5 L7 11 L13 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="10" y1="2" x2="10" y2="18" stroke="currentColor" stroke-width="1.5"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M10 6 L10 10 L13 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect x="10" y="10" width="320" height="570" rx="16" fill="#f2f2f2"/>

  <rect x="125" y="26" width="90" height="32" rx="16" fill="#211f26"/>
  <g color="#d0bcff">
    <use href="#i-antenna" x="137" y="34" width="16" height="16"/>
  </g>
  <text x="160" y="46" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#cac4d0">3/6</text>

  <rect x="30" y="74" width="280" height="480" rx="16" fill="#141218"/>

  <text x="46" y="100" font-size="15" font-weight="500" fill="#e6e0e9">AIO v2 antennas</text>
  <text x="46" y="116" font-size="12" fill="#938f99">Active</text>
  <path d="M274 88 L282 96 M282 88 L274 96" stroke="#938f99" stroke-width="1.5" stroke-linecap="round"/>

  <g color="#d0bcff"><use href="#i-gps" x="46" y="141" width="20" height="20"/></g>
  <text x="76" y="148" font-size="13" fill="#e6e0e9">GPS</text>
  <text x="76" y="162" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#938f99">GPIO27 &#183; On</text>
  <rect x="258" y="141" width="36" height="20" rx="10" fill="#d0bcff"/>
  <circle cx="284" cy="151" r="7" fill="#141218"/>

  <g color="#938f99"><use href="#i-lora" x="46" y="175" width="20" height="20"/></g>
  <text x="76" y="182" font-size="13" fill="#e6e0e9">LoRa</text>
  <text x="76" y="196" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#938f99">GPIO16 &#183; Off</text>
  <rect x="258" y="175" width="36" height="20" rx="10" fill="#49454f"/>
  <circle cx="268" cy="185" r="7" fill="#cac4d0"/>

  <g color="#d0bcff"><use href="#i-sdr" x="46" y="209" width="20" height="20"/></g>
  <text x="76" y="216" font-size="13" fill="#e6e0e9">SDR</text>
  <text x="76" y="230" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#938f99">GPIO7 &#183; On</text>
  <rect x="258" y="209" width="36" height="20" rx="10" fill="#d0bcff"/>
  <circle cx="284" cy="219" r="7" fill="#141218"/>

  <g color="#d0bcff"><use href="#i-usb" x="46" y="243" width="20" height="20"/></g>
  <text x="76" y="250" font-size="13" fill="#e6e0e9">Internal USB</text>
  <text x="76" y="264" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#938f99">GPIO23 &#183; On</text>
  <rect x="258" y="243" width="36" height="20" rx="10" fill="#d0bcff"/>
  <circle cx="284" cy="253" r="7" fill="#141218"/>

  <text x="46" y="282" font-size="11" font-weight="500" fill="#938f99">Wifi (AC1200)</text>

  <g color="#d0bcff"><use href="#i-wifi" x="46" y="292" width="20" height="20"/></g>
  <text x="76" y="299" font-size="13" fill="#e6e0e9">wlan0</text>
  <text x="76" y="313" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#938f99">Connected: HomeNet-5G</text>
  <rect x="258" y="292" width="36" height="20" rx="10" fill="#d0bcff"/>
  <circle cx="284" cy="302" r="7" fill="#141218"/>

  <g color="#938f99"><use href="#i-wifi" x="46" y="326" width="20" height="20"/></g>
  <text x="76" y="333" font-size="13" fill="#e6e0e9">wlan1</text>
  <text x="76" y="347" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#938f99">Down</text>
  <rect x="258" y="326" width="36" height="20" rx="10" fill="#49454f"/>
  <circle cx="268" cy="336" r="7" fill="#cac4d0"/>

  <text x="46" y="366" font-size="11" font-weight="500" fill="#938f99">Bluetooth (AC1200)</text>

  <g color="#d0bcff"><use href="#i-bt" x="46" y="376" width="20" height="20"/></g>
  <text x="76" y="383" font-size="13" fill="#e6e0e9">hci0</text>
  <text x="76" y="397" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#938f99">Enabled</text>
  <rect x="258" y="376" width="36" height="20" rx="10" fill="#d0bcff"/>
  <circle cx="284" cy="386" r="7" fill="#141218"/>

  <g color="#938f99"><use href="#i-bt" x="46" y="410" width="20" height="20"/></g>
  <text x="76" y="417" font-size="13" fill="#e6e0e9">hci1</text>
  <text x="76" y="431" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#938f99">Disabled</text>
  <rect x="258" y="410" width="36" height="20" rx="10" fill="#49454f"/>
  <circle cx="268" cy="420" r="7" fill="#cac4d0"/>

  <text x="46" y="454" font-size="11" font-weight="500" fill="#938f99">Board</text>

  <g color="#938f99"><use href="#i-clock" x="46" y="464" width="20" height="20"/></g>
  <text x="76" y="471" font-size="13" fill="#e6e0e9">Hardware clock (RTC)</text>
  <text x="76" y="485" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#938f99">Write system time to RTC</text>
  <rect x="246" y="464" width="48" height="20" rx="10" fill="#d0bcff"/>
  <text x="270" y="478" font-size="10" font-weight="500" fill="#141218" text-anchor="middle">Sync</text>

  <rect x="46" y="498" width="248" height="36" rx="8" fill="#8c1d18"/>
  <path d="M232 510 L232 518 M228.5 512 A5 5 0 1 0 235.5 512" fill="none" stroke="#f2b8b5" stroke-width="1.4" stroke-linecap="round"/>
  <text x="242" y="520" font-size="12" font-weight="500" fill="#f2b8b5">All off</text>
</svg>
